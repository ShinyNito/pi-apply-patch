name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm typecheck

  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            cross: true
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            cross: true
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    name: ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install rustup on Windows ARM64
        if: matrix.settings.runner == 'windows-11-arm'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe" -OutFile rustup-init.exe
          .\rustup-init.exe --default-toolchain stable -y
          "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding ascii $env:GITHUB_PATH
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.settings.runner != 'windows-11-arm'
        with:
          targets: ${{ matrix.settings.target }}
      - uses: mlugg/setup-zig@v2
        if: matrix.settings.cross == true
      - run: pnpm install --frozen-lockfile
      - name: Build native binding
        if: matrix.settings.cross != true
        run: >-
          pnpm --filter @shinynito/apply-patch-node exec napi build
          --cwd .
          --manifest-path ../../Cargo.toml
          --package apply-patch-node
          --package-json-path package.json
          --output-dir native
          --target ${{ matrix.settings.target }}
          --platform --no-js --release -- --locked
      - name: Build native binding with Zig
        if: matrix.settings.cross == true
        run: >-
          pnpm --filter @shinynito/apply-patch-node exec napi build
          --cwd .
          --manifest-path ../../Cargo.toml
          --package apply-patch-node
          --package-json-path package.json
          --output-dir native
          --target ${{ matrix.settings.target }}
          --cross-compile --platform --no-js --release -- --locked
      - run: pnpm --filter @shinynito/apply-patch-node build:ts
      - name: Test native binding
        if: ${{ !contains(matrix.settings.target, 'musl') }}
        run: node --test packages/apply-patch-node/test/*.test.mjs
      - name: Test musl native binding
        if: contains(matrix.settings.target, 'musl')
        shell: bash
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/work"
          -w /work
          node:24-alpine
          sh -lc "node --test packages/apply-patch-node/test/*.test.mjs"
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/apply-patch-node/native/apply-patch.*.node
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: packages/apply-patch-node/artifacts
      - name: Collect native bindings
        working-directory: packages/apply-patch-node
        run: |
          find artifacts -name 'apply-patch.*.node' -type f -exec cp {} native/ \;
          test "$(find native -name 'apply-patch.*.node' -type f | wc -l | tr -d ' ')" = "8"
      - name: Build Node SDK
        run: pnpm --filter @shinynito/apply-patch-node build:ts
      - name: Publish Node SDK
        working-directory: packages/apply-patch-node
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      - name: Publish Pi extension
        working-directory: packages/pi-apply-patch
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
